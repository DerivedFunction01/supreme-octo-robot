id: venue-extend-guard
title: 'Extend guard - every live lease extended before it lapses'
kind: scripted
status: active
cadence:
  type: interval
  every: 30m
owner: none
owner_reason: 'Owner-ordered coverage (2026-11-06): extending a live lease is lifecycle, never a fresh start; the guard keeps a venue standing for work that fires later.'
run:
  argv:
    - python3
    - ${REPO}/../venue/bin/venue-extend-guard
timeout_secs: 300
report:
  when: on_failure
  ok_exit_codes:
    - 0
escalate_body: bodies/venue-extend-guard.md
state_paths:
  - ${REPO}/../venue/var/extend-guard-state.json
classification: 'fixed command (bin/venue-extend-guard); reads every lease record and applies the extend_guard policy from the lease config (per-shape/per-caller modes over activity read from records and run records; idle leases capped per shape, warmest first, once per idle episode), extending through the lease core; exit 0 when every due lease is extended or deliberately skipped (extensions and decision lines print as JSON and need no speech), exit 3 with one JSON finding line per refusal or bad policy value; when it speaks is fully determined by the exit code and its episode state file, no content judgment'
lifetime: permanent
