id: vm-restart-detector
title: VM restart detector — reports each new boot once (boot-id comparison)
kind: scripted
status: active
cadence:
  type: interval
  every: 5m
timezone: America/New_York
owner: none
owner_reason: owner-commissioned fleet environment tripwire (2026-11-08); a restart fact serves every project on the machine, so no single goal owns it; each detection reports to the main chat
run:
  argv:
    - bash
    - ${REPO}/ops/server-care/vm_boot_check.sh
timeout_secs: 60
report:
  when: on_output
  ok_exit_codes:
    - 0
    - 3
state_paths:
  - ${REPO}/state/vm-boot
classification: fixed command (one bash script); every outcome branches on the boot-id comparison alone — silent baseline adoption, silent match, one RESTART line (plus any LOST probe lines) on change, exit 3 when the boot-id source is unreadable; speaking is fully determined by those branches
source:
  catalog: example-vm-restart-detector
  catalog_version: 1
  parameters:
    id: vm-restart-detector
    title: VM restart detector — reports each new boot once (boot-id comparison)
    owner: none
    owner_reason: owner-commissioned fleet environment tripwire (2026-11-08); a restart fact serves every project on the machine, so no single goal owns it; each detection reports to the main chat
    timezone: America/New_York
    cadence_every: 5m
lifetime: permanent
