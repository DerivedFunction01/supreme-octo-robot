id: worktree-trim-deep
title: Worktree trim (12-hour, deep cap) — oldest lane worktrees that miss the deep cut and — no state exempts a tree or a branch from the cap, not uncommitted or unlanded work, not a live process, not a run record, not an explicit hold (uncommitted work is auto-committed in place by the trim in the same pass, onto trim/autocommit-<tree> for a detached tree; a failed auto-commit is reported by name, and a repo still over cap at pass end is reported as CAP-OVER) are moved to the archive folder, permanently removed 1 hour later, and their branches trimmed at that purge only when provably the archive's own
kind: scripted
status: active
cadence:
  type: interval
  every: 12h
timezone: America/New_York
owner: goal:workhorse-superapp-build
run:
  argv:
    - bash
    - ${REPO}/ops/worktree_trim.sh
    - --tier
    - deep
timeout_secs: 1800
report:
  when: on_output
  ok_exit_codes:
    - 0
    - 3
state_paths:
  - ${REPO}/state/worktree-trim
  - ${WS}/worktree-archive
classification: 'fixed command sequence (two bash scripts: ops/worktree_trim.sh runs ops/worktree_archive_clean.sh first, then census, auto-commit of dirty trees, ranking, and mv-archive per repo in one worker process per repo; the purge charges branch trims, the queue drain deletes origin branches); every outcome branches on enumerable git/filesystem/process state or exit codes (cap math over last-activity stamps, dirty/ahead/merged census facts, auto-commit success or failure (a detached tree's deterministic trim branch, the repo's configured identity — its absence is the named no-identity failure), mv success or failure, branch tip vs manifest head and base ancestry at purge, origin reachable or queued for retry); speech is fully determined by those branches — silent when nothing was archived, purged, auto-committed, or failed, otherwise one structured line per act, with each AUTOCOMMIT line naming the tree, branch, and new head, each AUTOCOMMIT-FAILED line naming the tree with its step and reason, each ARCHIVED line naming the archive path, its 1-hour expiry as the owning lanes rescue window, and the mechanical restore verb (ops/worktree_restore.sh), and each CAP-OVER line naming the repo still over its cap at pass end'
lifetime: permanent
