id: local-test-watch
title: Local test watcher — deterministic detection of test runs on the local box
kind: scripted
status: active
cadence:
  type: interval
  every: 1m
timezone: America/New_York
owner: none
owner_reason: Venue-discipline instrumentation commissioned by the owner 2026-11-09 after a manual defect notice for local test runs; tightened 2026-11-10 at his direction (no checks or code run locally while the High-RAM fleet is live — he is paying for the fleet). Findings serve every project on the machine, so no single goal owns the entry. First-sighting warnings route directly to the owning thread via the harness connector (routes in state/local-test-watch-routes.json) when a route and token are configured, and a copy routes to the main destination the routes file declares under its main key. Every first sighting in either mode also raises a defect item on the attention surface (one per episode, deduped by handle + source ref) and opens an entry in the disposition record (state/local-test-watch-dispositions.json): an episode clears only by a disposition recorded through the watcher's disposition verb (reason, actor, stamp in the record) — never by an ack or by the episode ending — and a reappearing episode whose signature carries a closed, reasoned disposition raises nothing. Every printed line carries the routing outcome for each destination (owning thread, main, defect item); steady state is silent.
run:
  argv:
    - python3
    - ${REPO}/ops/watches/local_test_watch.py
timeout_secs: 60
report:
  when: on_output
  ok_exit_codes:
    - 0
    - 3
state_paths:
  - ${REPO}/state/local-test-watch.json
  - ${REPO}/state/local-test-watch-routes.json
  - ${REPO}/state/local-test-watch-dispositions.json
classification: 'fixed command (one Python script): every cycle samples processes via /proc (argv + cwd + pid/ppid, reads only) and branches on the mechanical matchers alone, in two modes chosen by a mechanical signal — whether any venue-liveness entry stands in the registry (a live High-RAM fleet session; the lease core renders and removes those entries). NORMAL mode (no fleet live): silence when no test-runner process has its cwd inside the workspace; one LOCAL-TEST finding line per new episode per process signature (episode state in state/local-test-watch.json; a continuing episode never re-speaks, a closed episode that reappears is a new finding); the narrow pre-check exemption is mechanical (one test file plus a name filter; pytest <=5 named node ids from one file, or one file plus -k); check.py and package-test always flag. STRICT mode (fleet live; owner ruling 2026-11-10): the exemption is suspended and the trigger broadens to any local check/code execution from a workspace repo — test runners and gates, dev/backend servers (server binaries, python -m http.server, server-shaped script names, package dev/serve/start scripts), and experiment scripts (an interpreter running a script file) — while managed infrastructure never flags (the scheduler system''s own automation surface — any argv running a script under this repo''s ops/ or bin/, the scripted legs and this watcher included — and argv matching the untracked routes file''s service patterns: the long-running servers, the fleet machinery; ancestry is not the discriminator, since agent work routed through the server''s ops channel runs as server children too and must still flag). A strict finding is a WARNING printed on first sighting in the same cycle, naming the repo''s owning thread from the untracked routes file, and is also sent directly to that thread via the harness connector (caller local-test-watch, send scope, envelope local-test-watch-<signature> for dedupe) when a route and token are configured. Enforcement (the 2026-11-18 cure of the detection-without-a-consumer gap): every first sighting in either mode raises one defect item per episode on the attention surface through the attention package''s ingest (handle main, kind defect, source ref local-test-watch-<signature>, clears_at_source false, routing naming the scheduler workhorse and the owning thread, title naming the programme, the process, and the venue state at flag time — mode, live session count, load, first-seen stamp), sends a copy of the notification to the main destination declared in the routes file under its main key (envelope local-test-watch-main-<signature>) when that route and a sender are configured, and opens an entry in the disposition record (state/local-test-watch-dispositions.json, keyed by episode signature, born open with the finding and the routing outcomes). An entry closes only through the watcher''s disposition verb (local_test_watch.py disposition <signature> --reason <text> --actor <handle>), which writes the reason, the actor, and the stamp into the record and marks the defect item done when the store seam is configured; a reappearing episode whose signature carries a closed entry with a reason is the same explained process — it raises no item and sends nothing, printing one LOCAL-EXEC EXPLAINED line per episode — while an undispositioned reappearance re-raises. A failed or unconfigured route, main copy, or item post never fails the cycle; the printed line (captured by the scheduler as a report ping, report: on_output) carries each destination''s outcome (routed=, main=, item=) so a silent drop is visible on the line itself. Exit 3 when /proc cannot be listed. Flagging is on sight, never load-gated; the load average is recorded in the finding as context only. Speaking is fully determined by those branches; the watcher reports and routes facts and judges nothing beyond the mechanical matchers.'
lifetime: permanent
catalog:
  origin: hand
  generality: deployment-specific
  use_case: fleet-health
