id: usmc-lane-watchdog
title: USMC Pay Monitor v2 — venue lane watchdog
kind: scripted
status: suspended
suspend_reason: Owner ruling 2026-11-08 — the venue lane stays down (its Standard session is dead and the owner declined to revive or re-point it); gates and probes only. Suspension lifts on the owner's word when the lane is revived.
suspended_on: 2026-11-08
cadence:
  type: interval
  every: 5m
timezone: America/New_York
owner: goal:usmc-pay-monitor-v2
run:
  cwd: ${WS}/usmc-pay-monitor-v2
  argv:
    - ${WS}/usmc-pay-monitor-v2/var/venv/bin/python
    - -m
    - platform.lane_watchdog
timeout_secs: 5400
report:
  when: on_failure
  ok_exit_codes:
    - 0
escalate_body: bodies/usmc-lane-watchdog.md
state_paths:
  - ${WS}/usmc-pay-monitor-v2/var/state/runtime/lane-watchdog-episode.json
classification: fixed command (the lane watchdog ladder, composed as data: cwd the app root, argv the app's venv python -m platform.lane_watchdog); checks run in a fixed order over durable records (unit files byte-equal to the current render, units active, keeper checkpoint pull fresh inside 900s, ferried holder evidence fresh inside 900s) and every action branches on those enumerable verdicts — reinstall and start the units, start an inactive unit, restart the keeper unit, or the rollover chain (env-build, preflight pass line, keeper restart, resident restarts) — behind an episode marker that allows one attempt per episode; exit 0 is a healthy lane before or after the ladder, exit 1 an unhealthy lane whose episode is spent, exit 2 missing wiring; speech is fully determined by the exit code, no content judgment.
lifetime: permanent
