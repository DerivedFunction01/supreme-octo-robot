id: workbench-viewer-doctor
title: Workbench Viewer doctor
kind: scripted
status: active
cadence:
  type: interval
  every: 15m
timezone: America/New_York
owner: goal:workbench-viewer-server
run:
  argv:
    - bash
    - ${WS}/supreme-octo-robot/pipeline/workrecord/ops/doctor.sh
timeout_secs: 600
report:
  when: on_failure
  ok_exit_codes:
    - 0
    - 1
escalate_body: bodies/workbench-viewer-doctor.md
state_paths:
  - ${WS}/supreme-octo-robot/pipeline/workrecord/state/doctor.log
classification: fixed command; exit 0 clean and exit 1 findings are both normal (findings travel the doctor's own workbench-outbox digest, never an agent) and only a crash (exit 2+) escalates - owner ruling normal means no agent. Timeout 600 assigned at seed - the cron set none.
lifetime: permanent
