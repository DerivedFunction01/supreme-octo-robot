id: storage-watch
title: Storage watch — one report per free-space threshold crossing (home + /tmp)
kind: scripted
status: active
cadence:
  type: interval
  every: 15m
timezone: America/New_York
owner: none
owner_reason: owner-commissioned fleet tripwire (2026-11-08) after the home filesystem filled unwatched (57G used 2026-11-07 to 108G used in a day, chunks 7.9G to 39G); free space serves every project on the machine, so no single goal owns it; crossings report to the main chat
run:
  argv:
    - python3
    - ${REPO}/ops/watches/storage_watch.py
timeout_secs: 300
report:
  when: on_output
  ok_exit_codes:
    - 0
    - 3
state_paths:
  - ${REPO}/state/storage-watch
classification: fixed command (one Python script); every outcome branches on two disk_usage reads against fixed thresholds — silent baseline adoption, silent healthy match, one report per threshold crossing (low, then critical), silent de-escalation and recovery, exit 3 when a filesystem is unreadable; speaking is fully determined by those branches and the recorded episode levels
source:
  catalog: example-storage-watch
  catalog_version: 1
  parameters:
    id: storage-watch
    title: Storage watch — one report per free-space threshold crossing (home + /tmp)
    owner: none
    owner_reason: owner-commissioned fleet tripwire (2026-11-08) after the home filesystem filled unwatched (57G used 2026-11-07 to 108G used in a day, chunks 7.9G to 39G); free space serves every project on the machine, so no single goal owns it; crossings report to the main chat
    timezone: America/New_York
    cadence_every: 15m
lifetime: permanent
config:
  version: 3
  knobs:
    home_low_free_gb:
      label: Low tier — home free space below
      type: integer
      unit: GB
      value: 50
      min: 1
      max: 500
      env: STORAGE_WATCH_HOME_LOW_GB
    home_critical_free_gb:
      label: Critical tier — home free space below
      type: integer
      unit: GB
      value: 45
      min: 1
      max: 500
      env: STORAGE_WATCH_HOME_CRIT_GB
  constraints:
    critical_below_low:
      kind: lt
      left: home_critical_free_gb
      right: home_low_free_gb
      message: The critical tier must sit below the low tier.
