id: file-registry-check
title: File-registry check — boot-triggered must-exist file pass (contract v1)
kind: scripted
status: active
cadence:
  type: interval
  every: 5m
timezone: America/New_York
owner: none
owner_reason: Fleet-survival instrumentation under the shared file-registry contract, commissioned by the owner 2026-11-09; the registry serves every workhorse on the machine, so no single goal owns it. The live manifest is seeded empty — entries land only by the owner's seed-list ruling.
run:
  argv:
    - python3
    - ${REPO}/ops/watches/file_registry.py
timeout_secs: 300
report:
  when: on_output
  ok_exit_codes:
    - 0
    - 3
state_paths:
  - ${REPO}/registry/file-registry.yaml
  - ${REPO}/state/file-registry-state.json
classification: 'fixed command (one Python script): every pass reads the boot identity (the restart detector''s /proc source) and evaluates the live manifest (registry/file-registry.yaml) exactly per the file-registry contract v1 — presence rules exists / non-empty / sha256 with no partial credit, restore by declared class only (tracked from the repo HEAD, generated by the declared generator, backup copied back — a backup that fails presence flags rather than chaining; flag-only never written), every restore re-checked, an unrestorable failure flagged with its entry''s owner named. Speaking is fully determined: one findings-first report when findings exist and the boot changed or the findings differ from the last reported set, silence on a clean or unchanged pass, exit 3 when the manifest or boot-id source is unreadable or invalid. The pass is the same code path at boot, on interval, and manually. The checker invents no content, ever.'
lifetime: permanent
catalog:
  origin: hand
  generality: deployment-specific
  use_case: file-survival
