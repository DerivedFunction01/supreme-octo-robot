id: colab-store-prune
title: 'Colab runner store auto-prune - reclaims transfer staging when free space crosses 45 GB'
kind: scripted
status: active
cadence:
  type: interval
  every: 15m
owner: none
owner_reason: 'Owner-ruled standing auto-prune (2026-11-12: auto prune, do not wait for a tap, else lockout); operated by the colab lease panel thread, which owns the runner store and the prune bounds.'
run:
  argv:
    - python3
    - ${WS}/supreme-octo-robot/pipeline/venue/ops/store_prune.py
    - --if-below-gb
    - '45'
    - --target-free-gb
    - '60'
timeout_secs: 900
report:
  when: on_output
  ok_exit_codes:
    - 0
state_paths:
  - ${WS}/supreme-octo-robot/pipeline/venue/var/prune-log.jsonl
classification: 'fixed command (one Python script): every pass reads free space and, only when it is below 45 GB, deletes from enumerable classes under fixed bounds (parts of complete transfers, snapshot bundles and unrecorded transfer staging past a 2h floor, failed-transfer parts past a 24h resume window, payload dirs of terminal runs, gate scratch; run/transfer records and anything in flight or fresh are never candidates) until 60 GB free; speech is fully determined by the branches - silent above the threshold, one JSON report when a prune fires, non-zero exit on failure'
lifetime: permanent
