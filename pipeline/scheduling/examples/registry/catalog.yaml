# The classified schedule catalog — the index over this layer.
# Every file in examples/registry/ is classified here exactly
# once, on the shared axes (class, origin, generality,
# use_case). Entry rows mirror the entry file's own catalog
# block (the validator checks they agree); config-example rows
# classify the data specimens that ride with one named entry's
# adoption and are never adopted standalone. Classification is
# descriptive, not activating: being listed here admits
# nothing anywhere. Adoption is the `bin/sched adopt` verb.
# Generality speaks beyond the standard adoption set (id,
# title, owner, owner_reason, timezone): generalized =
# nothing entry-specific to fill; parameterized = declared
# parameters must be filled or defaulted; deployment-specific
# = the file carries a deployment's own content and no copy
# is offered.
version: 1
entries:
  example-agent-review:
    file: example-agent-review.yaml
    class: entry
    origin: hand
    generality: generalized
    use_case: demo
