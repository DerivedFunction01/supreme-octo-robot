id: venue-liveness-example-session-00
title: 'Liveness check - Colab session example-session-00'
kind: scripted
status: active
cadence:
  type: interval
  every: 15m
owner: none
owner_reason: 'Machine-written by the venue lease core for one live lease; the lease record is the record of truth and this entry is its derived schedule.'
run:
  argv:
    - python3
    - ${REPO}/../venue/bin/venue-liveness
    - example-session-00
timeout_secs: 120
report:
  when: on_failure
  ok_exit_codes:
    - 0
escalate_body: bodies/example-venue-liveness.md
state_paths:
  - ${REPO}/../venue/var/liveness-example-session-00.json
classification: 'fixed command (bin/venue-liveness <session>); local file reads only, never dials the session; exit 0 healthy, cleared, or gone (self-disarmed), exit 3 with one LIVENESS line per finding it must speak; when it speaks is fully determined by its state file and the exit code, no content judgment'
lifetime: until_complete
self_removal: 'the lease core deletes this entry in the same call that deletes the lease record; the checker deletes it itself on the first run that finds no live record, and the reaper hook reconciliation retires any orphan'

catalog:
  origin: machine
  generality: deployment-specific
  use_case: fleet-health
  setup:
    state_dirs:
      - ${REPO}/../venue/var
