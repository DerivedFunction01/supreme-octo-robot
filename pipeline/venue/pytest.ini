[pytest]
# The suite's import mode: test modules import under
# their rootdir-relative names, so duplicate module
# basenames across suite dirs (the writer-route,
# bind-liveness, and binding-replace modules each live
# in two dirs) collect instead of dying at collection
# as import-file mismatches under the default mode.
addopts = --import-mode=importlib
# The harness homes the suite's sibling imports resolve
# against (the importlib mode inserts no per-directory
# paths of its own): the shared fixtures dir and each
# suite dir whose harness module its tests import by
# bare name.
pythonpath =
    tests/fixtures
    tests/test_lease_unit
    tests/test_lease_fake
    tests/test_runner_fake
    tests/ui
