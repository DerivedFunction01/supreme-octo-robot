<script>
(function () {
  "use strict";

  var spec = JSON.parse(document.getElementById("ck-spec").textContent);
  var LS_KEY = "ck:" + spec.id;
  var choicesById = {};
  spec.choices.forEach(function (c) { choicesById[c.id] = c; });
  // choice id -> id of the section that hosts it inline (first one wins)
  var hostSection = {};
  (spec.sections || []).forEach(function (s) {
    (s.controls || []).forEach(function (cid) {
      if (!(cid in hostSection)) hostSection[cid] = s.id;
    });
  });

  /* ---------------- state ---------------- */

  function defaultFor(c) {
    if (c.default !== undefined) {
      return Array.isArray(c.default) ? c.default.slice() : c.default;
    }
    switch (c.type) {
      case "toggle": return false;
      case "single": {
        var rec = (c.options || []).filter(function (o) { return o.recommended; })[0];
        if (rec) return rec.value;
        return c.options && c.options.length ? c.options[0].value : "";
      }
      case "multi": return [];
      case "slider": return c.min !== undefined ? c.min : 0;
      default: return "";
    }
  }

  function coerce(c, v) {
    switch (c.type) {
      case "toggle": return typeof v === "boolean" ? v : undefined;
      case "multi": return Array.isArray(v) ? v.slice() : undefined;
      case "slider":
      case "input-number":
        if (typeof v === "number" && isFinite(v)) return v;
        if (typeof v === "string" && v.trim() !== "" && isFinite(Number(v))) return Number(v);
        return undefined;
      default: return typeof v === "string" ? v : undefined;
    }
  }

  // Answer state (payload v2): a choice is ANSWERED only when
  // the reader changes it or commits it. Controls always
  // display a value (the default before any touch), but a
  // displayed default is not an answer and never enters the
  // payload as one. `answered` is the set of answered ids.
  function loadState() {
    var state = {};
    var answered = {};
    spec.choices.forEach(function (c) { state[c.id] = defaultFor(c); });
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var stored = JSON.parse(raw);
        // Current record: {values, answered}. Legacy record
        // (kit v1): a bare values object — its values load
        // for display, and nothing in it counts as answered.
        var values = stored;
        var marks = null;
        if (stored && typeof stored === "object"
            && stored.values && typeof stored.values === "object") {
          values = stored.values;
          marks = Array.isArray(stored.answered) ? stored.answered : [];
        }
        spec.choices.forEach(function (c) {
          if (Object.prototype.hasOwnProperty.call(values, c.id)) {
            var v = coerce(c, values[c.id]);
            if (v !== undefined) state[c.id] = v;
          }
          if (marks && marks.indexOf(c.id) !== -1) answered[c.id] = true;
        });
      }
    } catch (e) { /* storage unavailable: defaults stand */ }
    return { state: state, answered: answered };
  }

  var loaded = loadState();
  var state = loaded.state;
  var answered = loaded.answered;
  var feedback = [];
  var fbMode = false;
  var selection = null; // {el, target, text}

  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        values: state,
        answered: Object.keys(answered).filter(function (id) { return answered[id]; })
      }));
    } catch (e) {}
  }

  function setValue(id, v) {
    state[id] = v;
    answered[id] = true;
    save();
    syncChoice(id);
  }

  function answeredCount() {
    return spec.choices.filter(function (c) { return answered[c.id]; }).length;
  }

  // Commit current: adopt everything on screen as answered,
  // at its displayed value — the deliberate wholesale answer.
  function commitCurrent() {
    spec.choices.forEach(function (c) { answered[c.id] = true; });
    save();
    spec.choices.forEach(function (c) { syncChoice(c.id); });
  }

  // Clear all: values back to defaults, nothing answered,
  // store rewritten. Feedback entries are not answers and
  // are untouched.
  function clearAll() {
    spec.choices.forEach(function (c) {
      state[c.id] = defaultFor(c);
      delete answered[c.id];
    });
    save();
    spec.choices.forEach(function (c) { syncChoice(c.id); });
  }

  /* ---------------- markdown-lite ---------------- */

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function inlineMd(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return s;
  }

  function md(text) {
    if (!text) return "";
    var html = "";
    String(text).split(/\n\s*\n/).forEach(function (block) {
      var lines = block.split("\n").map(function (l) { return l.trim(); })
        .filter(function (l) { return l !== ""; });
      if (!lines.length) return;
      var isList = lines.every(function (l) { return l.indexOf("- ") === 0; });
      if (isList) {
        html += "<ul>" + lines.map(function (l) {
          return "<li>" + inlineMd(l.slice(2)) + "</li>";
        }).join("") + "</ul>";
      } else {
        html += "<p>" + inlineMd(lines.join(" ")) + "</p>";
      }
    });
    return html;
  }

  /* ---------------- DOM helpers ---------------- */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function humanValue(c) {
    var v = state[c.id];
    switch (c.type) {
      case "toggle": return v ? "On" : "Off";
      case "single": {
        var opt = (c.options || []).filter(function (o) { return o.value === v; })[0];
        return opt ? opt.label : String(v);
      }
      case "multi": {
        if (!v || !v.length) return "None";
        return (c.options || [])
          .filter(function (o) { return v.indexOf(o.value) !== -1; })
          .map(function (o) { return o.label; }).join(", ");
      }
      case "slider": return String(v) + (c.unit ? " " + c.unit : "");
      default: return v === "" || v === undefined ? "—" : String(v);
    }
  }

  /* ---------------- controls ---------------- */

  var instanceSeq = 0;

  function buildControl(c, inline) {
    var wrap = el("div", "ck-choice");
    if (inline) wrap.id = "ck-choice-" + c.id;
    wrap.setAttribute("data-fb", "Choice: " + c.label);

    var label = el("div", "ck-choice-label", c.label);
    wrap.appendChild(label);
    if (c.help) wrap.appendChild(el("p", "ck-help", c.help));

    var inst = "ck-inst-" + (instanceSeq++);
    var box = el("div", "ck-control");

    if (c.type === "toggle") {
      var row = el("label", "ck-toggle-row");
      var sw = el("span", "ck-switch");
      var input = document.createElement("input");
      input.type = "checkbox";
      input.checked = !!state[c.id];
      input.setAttribute("data-ck-input", c.id);
      input.addEventListener("change", function () { setValue(c.id, input.checked); });
      sw.appendChild(input);
      sw.appendChild(el("span", "ck-switch-track"));
      row.appendChild(sw);
      var st = el("span", "ck-toggle-state");
      st.setAttribute("data-ck-readout", c.id);
      st.textContent = humanValue(c);
      row.appendChild(st);
      box.appendChild(row);
    } else if (c.type === "single" || c.type === "multi") {
      var fs = el("fieldset");
      (c.options || []).forEach(function (o) {
        var optLabel = el("label", "ck-opt");
        var inp = document.createElement("input");
        inp.type = c.type === "single" ? "radio" : "checkbox";
        inp.name = inst + "-" + c.id;
        inp.value = o.value;
        inp.setAttribute("data-ck-input", c.id);
        inp.setAttribute("data-ck-value", o.value);
        if (c.type === "single") {
          inp.checked = state[c.id] === o.value;
          inp.addEventListener("change", function () {
            if (inp.checked) setValue(c.id, o.value);
          });
        } else {
          inp.checked = (state[c.id] || []).indexOf(o.value) !== -1;
          inp.addEventListener("change", function () {
            var cur = (state[c.id] || []).slice();
            var i = cur.indexOf(o.value);
            if (inp.checked && i === -1) cur.push(o.value);
            if (!inp.checked && i !== -1) cur.splice(i, 1);
            // keep the stored order aligned with the option order
            cur.sort(function (a, b) {
              var vals = (c.options || []).map(function (x) { return x.value; });
              return vals.indexOf(a) - vals.indexOf(b);
            });
            setValue(c.id, cur);
          });
        }
        optLabel.appendChild(inp);
        optLabel.appendChild(document.createTextNode(o.label));
        if (o.recommended) optLabel.appendChild(el("span", "ck-badge", "Recommended"));
        fs.appendChild(optLabel);
      });
      box.appendChild(fs);
    } else if (c.type === "slider") {
      var srow = el("div", "ck-slider-row");
      var range = document.createElement("input");
      range.type = "range";
      if (c.min !== undefined) range.min = c.min;
      if (c.max !== undefined) range.max = c.max;
      if (c.step !== undefined) range.step = c.step;
      range.value = state[c.id];
      range.setAttribute("data-ck-input", c.id);
      range.addEventListener("input", function () { setValue(c.id, Number(range.value)); });
      srow.appendChild(range);
      var readout = el("span", "ck-readout");
      readout.setAttribute("data-ck-readout", c.id);
      readout.textContent = humanValue(c);
      srow.appendChild(readout);
      box.appendChild(srow);
    } else { // input-text / input-number
      var txt = document.createElement("input");
      txt.type = c.type === "input-number" ? "number" : "text";
      txt.className = "ck-text-input";
      txt.value = state[c.id];
      txt.setAttribute("data-ck-input", c.id);
      txt.addEventListener("input", function () {
        if (c.type === "input-number") {
          setValue(c.id, txt.value === "" ? "" : Number(txt.value));
        } else {
          setValue(c.id, txt.value);
        }
      });
      box.appendChild(txt);
    }

    wrap.appendChild(box);
    return wrap;
  }

  // Refresh every view of one choice after its value changes.
  function syncChoice(id) {
    var c = choicesById[id];
    var v = state[id];
    document.querySelectorAll('[data-ck-input="' + id + '"]').forEach(function (inp) {
      if (inp.type === "radio") {
        inp.checked = v === inp.getAttribute("data-ck-value");
      } else if (inp.type === "checkbox" && inp.hasAttribute("data-ck-value")) {
        inp.checked = (v || []).indexOf(inp.getAttribute("data-ck-value")) !== -1;
      } else if (inp.type === "checkbox") {
        inp.checked = !!v;
      } else if (inp.type === "range") {
        inp.value = v;
      } else if (document.activeElement !== inp) {
        inp.value = v;
      }
    });
    document.querySelectorAll('[data-ck-readout="' + id + '"]').forEach(function (n) {
      n.textContent = humanValue(c);
    });
    document.querySelectorAll('[data-ck-value-for="' + id + '"]').forEach(function (n) {
      n.textContent = answered[id] ? humanValue(c) : "Not answered yet";
    });
    var counter = document.getElementById("ck-answered-count");
    if (counter) {
      counter.textContent = answeredCount() + " of " + spec.choices.length + " answered";
    }
  }

  function jumpTo(id) {
    var target = document.getElementById("ck-choice-" + id);
    if (!target) return;
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.classList.remove("ck-flash");
    void target.offsetWidth; // restart the animation
    target.classList.add("ck-flash");
  }

  /* ---------------- page skeleton ---------------- */

  var bar = el("header", "ck-bar ck-chrome");
  if (spec.back && spec.back.href) {
    var backLink = el("a", "ck-back", spec.back.label || "← Back");
    backLink.href = spec.back.href;
    backLink.target = "_top";
    bar.appendChild(backLink);
  }
  bar.appendChild(el("span", "ck-bar-title", spec.title || spec.id));
  var answeredCountEl = el("span", "ck-fb-count",
    answeredCount() + " of " + spec.choices.length + " answered");
  answeredCountEl.id = "ck-answered-count";
  bar.appendChild(answeredCountEl);
  var fbCount = el("span", "ck-fb-count");
  bar.appendChild(fbCount);
  var fbBtn = el("button", null, "Feedback mode");
  fbBtn.type = "button";
  fbBtn.setAttribute("aria-pressed", "false");
  bar.appendChild(fbBtn);
  var commitBtn = el("button", null, "Commit current");
  commitBtn.type = "button";
  commitBtn.addEventListener("click", commitCurrent);
  bar.appendChild(commitBtn);
  var clearBtn = el("button", null, "Clear all");
  clearBtn.type = "button";
  clearBtn.addEventListener("click", clearAll);
  bar.appendChild(clearBtn);
  var copyBtn = el("button", "ck-primary", "Copy");
  copyBtn.type = "button";
  bar.appendChild(copyBtn);
  document.body.appendChild(bar);

  var banner = el("div", "ck-banner ck-chrome",
    "Feedback mode — clicks annotate, nothing changes");
  banner.hidden = true;
  document.body.appendChild(banner);

  var main = el("main");
  document.body.appendChild(main);

  if (spec.intro) {
    var intro = el("div", "ck-intro");
    intro.innerHTML = md(spec.intro);
    main.appendChild(intro);
  }

  (spec.sections || []).forEach(function (s) {
    var sec = el("section", "ck-section");
    sec.id = "ck-section-" + s.id;
    sec.setAttribute("data-ck-section", s.heading || s.id);
    if (s.fb) sec.setAttribute("data-fb", s.fb);
    sec.appendChild(el("h2", null, s.heading || ""));
    if (s.image) {
      var img = document.createElement("img");
      img.src = s.image.src;
      img.alt = s.image.alt || "";
      sec.appendChild(img);
    }
    var body = el("div", "ck-body");
    body.innerHTML = md(s.body || "");
    sec.appendChild(body);
    (s.controls || []).forEach(function (cid) {
      if (choicesById[cid]) sec.appendChild(buildControl(choicesById[cid], true));
    });
    main.appendChild(sec);
  });

  /* ---------------- summary: all choices ---------------- */

  var summary = el("section", "ck-summary");
  summary.setAttribute("data-ck-section", "All choices");
  summary.appendChild(el("h2", null, "All choices"));
  summary.appendChild(el("p", "ck-summary-sub",
    "Every pick in one place. Only answered choices travel with Copy — a value shown here is a default until you change it or press Commit current."));
  spec.choices.forEach(function (c) {
    var rowCard = el("div", "ck-row");
    var head = el("div", "ck-row-head");
    head.appendChild(el("span", "ck-row-label", c.label));
    if (hostSection[c.id]) {
      var jump = el("button", "ck-jump", "jump to section ↓");
      jump.type = "button";
      jump.addEventListener("click", function () { jumpTo(c.id); });
      head.appendChild(jump);
    }
    var val = el("span", "ck-row-value");
    val.setAttribute("data-ck-value-for", c.id);
    val.textContent = answered[c.id] ? humanValue(c) : "Not answered yet";
    head.appendChild(val);
    rowCard.appendChild(head);
    if (c.place !== "section") {
      rowCard.appendChild(buildControl(c, !hostSection[c.id]));
    }
    summary.appendChild(rowCard);
  });
  main.appendChild(summary);

  /* ---------------- feedback panel ---------------- */

  var fbPanel = el("section", "ck-feedback ck-chrome");
  fbPanel.setAttribute("data-ck-section", "Feedback");
  fbPanel.appendChild(el("h2", null, "Feedback"));
  var fbList = el("div");
  fbPanel.appendChild(fbList);
  main.appendChild(fbPanel);

  function renderFeedback() {
    fbList.textContent = "";
    if (!feedback.length) {
      fbList.appendChild(el("p", "ck-feedback-empty",
        "No feedback yet — turn on Feedback mode and click anything to annotate it."));
    }
    feedback.forEach(function (entry, idx) {
      var card = el("div", "ck-fb-entry");
      var head = el("div", "ck-fb-entry-head");
      head.appendChild(el("span", "ck-fb-target", entry.target));
      var rm = el("button", "ck-fb-remove", "remove");
      rm.type = "button";
      rm.addEventListener("click", function () {
        feedback.splice(idx, 1);
        renderFeedback();
      });
      head.appendChild(rm);
      card.appendChild(head);
      if (entry.text) card.appendChild(el("p", "ck-fb-text", '"' + entry.text + '"'));
      var ta = document.createElement("textarea");
      ta.className = "ck-fb-comment";
      ta.value = entry.comment;
      ta.placeholder = "Comment";
      ta.setAttribute("aria-label", "Comment for " + entry.target);
      ta.addEventListener("input", function () { entry.comment = ta.value; });
      card.appendChild(ta);
      fbList.appendChild(card);
    });
    fbCount.innerHTML = "";
    fbCount.appendChild(document.createTextNode("Feedback "));
    var strong = el("strong", null, String(feedback.length));
    fbCount.appendChild(strong);
  }

  /* ---------------- composer ---------------- */

  var composer = el("div", "ck-composer ck-chrome");
  composer.hidden = true;
  var compTarget = el("div", "ck-composer-target");
  var compText = el("div", "ck-composer-text");
  var compArea = document.createElement("textarea");
  compArea.placeholder = "Add a comment on this target…";
  compArea.setAttribute("aria-label", "Feedback comment");
  var compActions = el("div", "ck-composer-actions");
  var compCancel = el("button", null, "Cancel");
  compCancel.type = "button";
  var compAdd = el("button", "ck-primary", "Add");
  compAdd.type = "button";
  compActions.appendChild(compCancel);
  compActions.appendChild(compAdd);
  composer.appendChild(compTarget);
  composer.appendChild(compText);
  composer.appendChild(compArea);
  composer.appendChild(compActions);
  document.body.appendChild(composer);

  function snippetOf(node) {
    var t = "";
    if (node.tagName === "IMG") t = node.getAttribute("alt") || "";
    if (!t) t = node.innerText || node.textContent || "";
    t = String(t).trim().replace(/\s+/g, " ");
    return t.slice(0, 60);
  }

  function clearSelection() {
    if (selection && selection.el) selection.el.classList.remove("ck-selected");
    selection = null;
    composer.hidden = true;
  }

  function selectTarget(node) {
    clearSelection();
    var fbEl = node.closest ? node.closest("[data-fb]") : null;
    var target, text, outlineEl;
    if (fbEl) {
      target = fbEl.getAttribute("data-fb");
      text = snippetOf(fbEl);
      outlineEl = fbEl;
    } else {
      var sec = node.closest ? node.closest("[data-ck-section]") : null;
      var heading = sec ? sec.getAttribute("data-ck-section") : (spec.title || spec.id);
      target = heading + " · " + String(node.tagName || "node").toLowerCase();
      text = snippetOf(node);
      outlineEl = node;
    }
    selection = { el: outlineEl, target: target, text: text };
    outlineEl.classList.add("ck-selected");
    compTarget.textContent = target;
    compText.textContent = text ? '"' + text + '"' : "";
    compArea.value = "";
    composer.hidden = false;
    compArea.focus();
  }

  compAdd.addEventListener("click", function () {
    if (!selection) return;
    feedback.push({
      target: selection.target,
      text: selection.text,
      comment: compArea.value.trim()
    });
    renderFeedback();
    clearSelection();
  });
  compCancel.addEventListener("click", clearSelection);

  /* ---------------- feedback mode ---------------- */

  function inChrome(node) {
    return !!(node && node.closest && node.closest(".ck-chrome"));
  }

  ["click", "change", "submit", "input"].forEach(function (type) {
    document.addEventListener(type, function (e) {
      if (!fbMode) return;
      if (inChrome(e.target)) return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      if (type === "click") selectTarget(e.target);
    }, true);
  });

  fbBtn.addEventListener("click", function () {
    fbMode = !fbMode;
    document.body.classList.toggle("ck-fb-on", fbMode);
    fbBtn.setAttribute("aria-pressed", fbMode ? "true" : "false");
    fbBtn.textContent = fbMode ? "Feedback mode: on" : "Feedback mode";
    banner.hidden = !fbMode;
    if (!fbMode) clearSelection();
  });

  /* ---------------- copy ---------------- */

  function copyPayload() {
    var answers = {};
    var unanswered = [];
    spec.choices.forEach(function (c) {
      if (answered[c.id]) answers[c.id] = state[c.id];
      else unanswered.push(c.id);
    });
    return {
      artifact: spec.id,
      answers: answers,
      unanswered: unanswered,
      feedback: feedback.map(function (f) {
        return { target: f.target, text: f.text, comment: f.comment };
      })
    };
  }

  function flashCopied() {
    var old = copyBtn.textContent;
    copyBtn.textContent = "Copied";
    setTimeout(function () { copyBtn.textContent = old; }, 1200);
  }

  copyBtn.addEventListener("click", function () {
    var text = JSON.stringify(copyPayload(), null, 2);
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      flashCopied();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flashCopied, fallback);
    } else {
      fallback();
    }
  });

  renderFeedback();
})();
</script>
</body>
</html>
